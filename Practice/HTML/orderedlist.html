<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ordered list

      </title>
</head>

<body>
      <h1>Top 3 anime in my heart
      </h1>
      <ol>
            <li>NARUTO</li>
            <li>DRANGON BALL SUPER</li>
            <li>POKEMON</li>
      </ol>
      <h1>Anime list start with series 4</h1>
      <ol start="4">
            <li>BEN 10</li>
            <li>JJS</li>
            <li>DEMON SLAYER</li>
      </ol>
      <h1>Anime list in reversed</h1>
      <ol reversed start="1">
            <li>NARUTO</li>
            <li>DRANGON BALL SUPER</li>
            <li>POKEMON</li>
            <li>BEN 10</li>
            <li>JJS</li>
            <li>DEMON SLAYER</li>
      </ol>

</body>

</html>
