<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>fixed</title>
      <style>
            p.fixed{position:fixed;top: 50px;right: 50px;color: blue;}
      </style>
</head>
<body>
      <p>This is paragraph 1</p>
      <p>This is paragraph 2</p>
      <p>This is paragraph 3</p>
      <p class="fixed">This is the fix position text</p>
</body>
</html>
