<!DOCTYPE html>
<html><head><title>document write property</title><script>
function f1(){
var a=parseInt(frm1.t1.value);
for(i=1;i<=10;i++){
document.writeln(a*a*i+i+"<br/>");
}
}
</script>
</head><body>
<form name="frm1">
<input type="number" name="t1"><br>
<input type="button" value="click" onClick="f1()">
</form>
</body></html>
