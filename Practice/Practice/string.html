<!DOCTYPE html>
<html><head><title>Sting </title>
<script>
let str="My name is harishankar and my pet name is keashav.                    ";
let strs=str.charAt(1);
document.writeln(strs,"<br>");
let ind=str.indexOf("is");
document.writeln(ind,"<br>");
let lind=str.lastIndexOf("is");
document.writeln(lind,"<br>");
let sub=str.substr(10,7);
document.writeln(sub,"<br>");
let ssub=str.substring(10,7);
document.writeln(ssub,"<br>");
let rim=str.trim();
document.writeln(rim,"<br>");
let up=str.toUpperCase();
document.writeln(up,"<br>");
let low=str.toLowerCase();
document.writeln(low,"<br>");
</script>
</head>
<body></body></html>
